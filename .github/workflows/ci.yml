name: PanURA quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install app and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-playwright
      - name: Check Python syntax
        run: python -m compileall -q app.py panura_engine.py panura_navigation.py tests
      - name: Test QSAR inference and molecular ID preservation
        run: python -m pytest -q tests/test_engine.py tests/test_inputs.py tests/test_visuals.py
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser responsive navigation tests
        run: python -m pytest -q tests/test_browser.py
